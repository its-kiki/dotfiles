[dotfiles]
"~/.bashrc" = { mode = "track" }
"~/.config/mise" = { mode = "track" }
"~/.gitconfig" = { mode = "track" }
"~/.npmrc" = { mode = "track" }
"~/.profile" = { mode = "track" }
